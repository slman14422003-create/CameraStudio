import java.util.Properties

plugins {
    id 'com.android.application'
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
def signStore = System.getenv('SIGNING_STORE_FILE') ?: keystoreProps.getProperty('storeFile')
def signStorePass = System.getenv('SIGNING_STORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
def signAlias = System.getenv('SIGNING_KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
def signKeyPass = System.getenv('SIGNING_KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword')
def hasSigning = signStore && signStorePass && signAlias && signKeyPass

android {
    namespace = 'com.camera.app'
    compileSdk = 36
    ndkVersion = '28.0.12433566'

    defaultConfig {
        applicationId = "app.camera.studio"
        minSdk = 24
        targetSdk = 36
        versionCode = (System.getenv('VERSION_CODE_OVERRIDE') ?: (10 + (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()).toString()).toInteger()
        versionName = System.getenv('APP_VERSION_NAME') ?: "1.0"
        // Galaxy A16 (Exynos 1330 / Helio G99) is 64-bit only: one ABI keeps the APK small
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    androidResources {
        localeFilters.addAll(['ar', 'en'])
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile = file(signStore)
                storePassword = signStorePass
                keyAlias = signAlias
                keyPassword = signKeyPass
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            debuggable = false
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = hasSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

    packaging {
        resources.excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/*.version',
                '/META-INF/*.kotlin_module',
                '/META-INF/DEPENDENCIES',
                '/META-INF/LICENSE*',
                '/META-INF/NOTICE*',
                '/META-INF/INDEX.LIST',
                '/kotlin/**',
                '**/*.kotlin_builtins',
                '**/*.kotlin_metadata',
                'DebugProbesKt.bin',
                'kotlin-tooling-metadata.json'
        ]
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'

    // CameraX: preview, still capture, vendor extensions (Samsung HDR / Night when the phone exposes them)
    def camerax = '1.4.2'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation "androidx.camera:camera-extensions:$camerax"
    implementation 'com.google.guava:listenablefuture:1.0'
}
